[project]
name = "switch-mcp"
version = "0.1.0"
description = "MCP server that lets an AI agent play a Nintendo Switch: emulated Bluetooth Pro Controller + HDMI capture."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
# Real Bluetooth backend. Linux only, builds dbus-python and PyGObject.
bluetooth = ["nuxbt>=3.3.7,<3.4"]

[project.scripts]
switch-mcp = "switch_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switch_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
